{% extends 'dashboard/base.html' %}

{% block content %}

<div class="card-box">

    <h3>New Raw Material Purchase</h3>

    <hr>

    <form method="POST" onsubmit="return prepareData()">

        {% csrf_token %}

        {{ form.as_p }}

        <hr>

        <h5>Purchase Items</h5>

        <table class="table table-bordered" id="item-table">

            <thead>

                <tr>

                    <th>Material</th>
                    <th>Quantity</th>
                    <th>Rate</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

        <button
            type="button"
            class="btn btn-success"
            onclick="addRow()"
        >
            Add Item
        </button>

        <hr>

        <input
            type="hidden"
            name="items_json"
            id="items_json"
        >

        <button
            type="submit"
            class="btn btn-primary">
            
        
            Save Purchase
        </button>

    </form>

</div>

<script>

function addRow(){

    let row = `
    <tr>

        <td>

            <select class="form-control material">

                {% for material in materials %}

                <option value="{{ material.id }}">

                    {{ material.name }}

                </option>

                {% endfor %}

            </select>

        </td>

        <td>

            <input
                type="number"
                class="form-control quantity"
                step="0.01"
            >

        </td>

        <td>

            <input
                type="number"
                class="form-control rate"
                step="0.01"
            >

        </td>

        <td>

            <button
                type="button"
                class="btn btn-danger"
                onclick="removeRow(this)"
            >
                Remove
            </button>

        </td>

    </tr>
    `;

    document.querySelector(
        '#item-table tbody'
    ).insertAdjacentHTML(
        'beforeend',
        row
    );
}

function removeRow(btn){

    btn.closest('tr').remove();

}

function prepareData(){

    let items = [];

    let valid = true;

    document.querySelectorAll(
        '#item-table tbody tr'
    ).forEach(function(row){

        let material = row.querySelector('.material').value;

        let quantity = row.querySelector('.quantity').value.trim();

        let rate = row.querySelector('.rate').value.trim();

        // Ignore completely empty rows
        if(quantity === "" && rate === ""){
            return;
        }

        // One field filled but the other missing
        if(quantity === "" || rate === ""){

            alert("Please enter both Quantity and Rate.");

            valid = false;

            return;
        }

        items.push({

            material: material,

            quantity: quantity,

            rate: rate

        });

    });

    if(!valid){

        event.preventDefault();

        return false;

    }

    if(items.length === 0){

        alert("Please add at least one purchase item.");

        event.preventDefault();

        return false;

    }

    document.getElementById("items_json").value =
        JSON.stringify(items);

    return true;

}

</script>

{% endblock %}
