{% extends 'dashboard/base.html' %}

{% block content %}

<div class="card-box">

<h3>Material Return Entry</h3>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<hr>

<h5>Add Returned Materials</h5>

<div class="row">

<div class="col-md-5">

<select id="material" class="form-control">

{% for m in materials %}

<option value="{{ m.id }}">

{{ m.name }}

</option>

{% endfor %}

</select>

</div>

<div class="col-md-3">

<input
type="number"
step="0.01"
id="qty"
class="form-control"
placeholder="Quantity">

</div>

<div class="col-md-2">

<button
type="button"
class="btn btn-success"
onclick="addItem()">

Add

</button>

</div>

</div>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>Material</th>

<th>Quantity</th>

<th>Action</th>

</tr>

</thead>

<tbody id="itemsTable">

</tbody>

</table>

<input
type="hidden"
id="items_json"
name="items_json">

<button class="btn btn-primary">

Save Return

</button>

</form>

</div>

<script>

let items=[];

function addItem(){

let material=document.getElementById("material");

let qty=document.getElementById("qty").value;

if(qty==="" || parseFloat(qty)<=0){

alert("Enter valid quantity.");

return;

}

items.push({

material:material.value,

material_name:material.options[
material.selectedIndex
].text,

quantity:qty

});

renderTable();

document.getElementById("qty").value="";

}

function removeItem(index){

items.splice(index,1);

renderTable();

}

function renderTable(){

let html="";

items.forEach((item,index)=>{

html+=`

<tr>

<td>${item.material_name}</td>

<td>${item.quantity}</td>

<td>

<button
type="button"
class="btn btn-danger btn-sm"
onclick="removeItem(${index})">

Remove

</button>

</td>

</tr>

`;

});

document.getElementById(
"itemsTable"
).innerHTML=html;

document.getElementById(
"items_json"
).value=JSON.stringify(items);

}

</script>

{% endblock %}
