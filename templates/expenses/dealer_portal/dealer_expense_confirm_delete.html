{% extends "dashboard/dealer_base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card-box text-center">

            <h4 class="mb-3">
                Delete Dealer Expense
            </h4>

            <p>
                Are you sure you want to delete this expense?
            </p>

            <div class="alert alert-warning">

                <strong>
                    Rs. {{ expense.amount|floatformat:2 }}
                </strong>

                <br>

                {{ expense.get_category_display }}

                <br>

                {{ expense.expense_date|date:"Y-m-d" }}

            </div>

            <form method="post">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'dealer_expense_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
