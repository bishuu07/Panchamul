{% extends 'dashboard/dealer_base.html' %}

{% block content %}

<div class="card-box">

    <h3>Customer Payment</h3>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group mb-3">

            <label>
                Customer
            </label>

            <select name="customer"
                    class="form-control"
                    required>

                <option value="">
                    Select Customer
                </option>

                {% for customer in customers %}

                <option value="{{ customer.id }}">
                    {{ customer.name }}
                </option>

                {% endfor %}

            </select>

        </div>

        <div class="form-group mb-3">

            <label>
                Payment Date
            </label>

            <input type="date"
                   name="payment_date"
                   class="form-control"
                   required>

        </div>

        <div class="form-group mb-3">

            <label>
                Amount
            </label>

            <input type="number"
                   step="0.01"
                   name="amount"
                   class="form-control"
                   required>

        </div>

        <button class="btn btn-success">

            Save Payment

        </button>

    </form>

</div>

{% endblock %}
