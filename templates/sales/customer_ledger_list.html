{% extends 'dashboard/base.html' %}

{% block content %}

<div class="card-box">

    <h3>Customer Ledger Summary</h3>

    <table class="table table-bordered">

        <thead>

            <tr>

                <th>Customer</th>
                <th>Total Sale</th>
                <th>Total Payment</th>
                <th>Outstanding</th>
                <th></th>

            </tr>

        </thead>

        <tbody>

            {% for row in data %}

            <tr>

                <td>
                    {{ row.customer.name }}
                </td>

                <td>
                    {{ row.debit }}
                </td>

                <td>
                    {{ row.credit }}
                </td>

                <td>
                    {{ row.balance }}
                </td>

                <td>

                    <a href="{% url 'customer_ledger_detail' row.customer.id %}"
                       class="btn btn-info btn-sm">

                        View Ledger

                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
