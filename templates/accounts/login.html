<!DOCTYPE html>
<html>
<head>
    <title>Panchamul ERP Login</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0B2E3C;
            --deep-water: #0E4A63;
            --teal: #1B8FA3;
            --ripple: #63C6D9;
            --gold: #C79A46;
            --mist: #F1F6F7;
            --paper: #FCFDFC;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: radial-gradient(1200px 800px at 15% -10%, #14607f 0%, #0B2E3C 55%, #081f29 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* ambient ripple rings, purely decorative */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(99, 198, 217, 0.18);
            pointer-events: none;
        }

        body::before {
            width: 900px;
            height: 900px;
            left: -300px;
            bottom: -420px;
        }

        body::after {
            width: 620px;
            height: 620px;
            right: -220px;
            top: -260px;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: var(--paper);
            border-radius: 18px;
            padding: 44px 40px 36px;
            box-shadow:
                0 30px 60px -20px rgba(3, 20, 27, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand .company {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 22px;
            color: var(--ink);
            letter-spacing: 0.02em;
            margin: 0;
        }

        .brand .tagline {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--gold);
            margin: 4px 0 16px;
        }

        .brand .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
        }

        .brand .divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, #d8e2e4, transparent);
        }

        .brand .divider .drop {
            width: 7px;
            height: 7px;
            background: var(--teal);
            border-radius: 50% 50% 50% 0;
            transform: rotate(45deg);
        }

        .brand .system {
            font-size: 15px;
            font-weight: 700;
            color: var(--deep-water);
            letter-spacing: 0.06em;
        }

        .brand .subsystem {
            font-size: 12px;
            color: #6b8891;
            margin-top: 2px;
        }

        h2.login-heading {
            display: none; /* replaced by branded header above; kept out of layout, not deleted from logic */
        }

        form {
            margin-top: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            font-size: 14px;
            font-family: 'Manrope', sans-serif;
            border: 1.5px solid #e0e7e8;
            border-radius: 9px;
            background: var(--mist);
            color: var(--ink);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #93a7ac;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--teal);
            background: var(--paper);
            box-shadow: 0 0 0 3px rgba(27, 143, 163, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 8px;
            padding: 13px 14px;
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #ffffff;
            background: linear-gradient(135deg, var(--teal), var(--deep-water));
            border: none;
            border-radius: 9px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            box-shadow: 0 10px 24px -10px rgba(14, 74, 99, 0.7);
        }

        button[type="submit"]:hover {
            filter: brightness(1.06);
            box-shadow: 0 14px 28px -10px rgba(14, 74, 99, 0.8);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
        }

        .footnote {
            text-align: center;
            font-size: 11px;
            color: #9fb2b7;
            margin-top: 22px;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand">
        <p class="company">Rajbhandari &amp; Sons</p>
        <p class="tagline">Beverage Company</p>
        <div class="divider">
            <span class="line"></span>
            <span class="drop"></span>
            <span class="line"></span>
        </div>
        <div class="system">Panchamul ERP System</div>
        <div class="subsystem">Sign in to continue</div>
    </div>

    <h2 class="login-heading">Login</h2>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="footnote">Panchamul ERP &middot; Internal use only</div>
</div>

</body>
</html>
